<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganesha's Festival Quest</title>
<style>
  *{box-sizing:border-box}
  :root{
    --pink:#f04f78;--orange:#ff8a3d;--gold:#ffc83d;--purple:#7c4dff;
    --green:#39a96b;--cream:#fff8e9;--ink:#542c38;
  }
  body{
    margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#ffd7e5 0%,#fff1bd 48%,#c9f3d3 100%);
    overflow-x:hidden;
  }
  button{font:inherit;cursor:pointer}
  .app{max-width:760px;margin:auto;min-height:100vh;position:relative;padding:18px}
  .petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .petal{position:absolute;top:-40px;animation:fall linear infinite;font-size:24px}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .topbar,.card,.stats,.home-buttons{position:relative;z-index:1}
  .topbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0 18px}
  .stat{background:#fffdf8dd;border:2px solid #f1b34d;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 4px 12px #7b3f0018}
  .card{background:#fffaf0ee;border:3px solid #fff;border-radius:30px;padding:28px;box-shadow:0 14px 40px #7b3f0030;text-align:center}
  .ganesha{font-size:76px;line-height:1}
  h1{font-size:clamp(34px,8vw,58px);line-height:.98;margin:10px 0;color:#d93d68;text-shadow:3px 3px #ffd05a}
  .subtitle{font-weight:700;color:#79505c;margin-bottom:22px}
  .btn{border:0;border-radius:18px;padding:14px 20px;font-weight:900;color:white;box-shadow:0 6px 0 #0002;transition:.15s;min-height:52px}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0002}
  .play{background:linear-gradient(135deg,#ef4d73,#ff8b38);width:100%;font-size:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .secondary{background:#fff;border:2px solid #edc36a;color:var(--ink);box-shadow:none}
  .secondary:hover{background:#fff5d7}
  .progress-wrap{margin-top:20px;text-align:left}
  .progress-label{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
  .progress{height:14px;border-radius:20px;background:#eadfcf;overflow:hidden;margin-top:6px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#ffb52e,#ef4d73);transition:.35s}
  .hidden{display:none}
  .mission-icon{font-size:64px}
  .mission-title{font-size:30px;margin:8px 0}
  .mission-text{font-size:17px;font-weight:700;line-height:1.5}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  .choice{background:#fff;border:3px solid #f1c65c;color:var(--ink);border-radius:18px;padding:18px;font-size:18px;font-weight:900}
  .choice:hover{background:#fff1bd}
  .feedback{min-height:30px;font-weight:900;margin-top:14px}
  .result-score{font-size:42px;color:#e34a70;font-weight:900}
  .small{font-size:13px;opacity:.75;margin-top:16px}
  @media(max-width:520px){.app{padding:12px}.card{padding:22px 16px}.grid,.choices{grid-template-columns:1fr}.ganesha{font-size:64px}}
</style>
</head>
<body>
<div class="petals" id="petals"></div>
<div class="app">
  <div class="topbar">
    <div class="stat">🪙 <span id="coins">0</span></div>
    <div class="stat">⭐ <span id="stars">0</span></div>
    <div class="stat">🎊 <span id="spirit">0</span>%</div>
  </div>

  <section id="home" class="card">
    <div class="ganesha">🐘 🐭</div>
    <h1>GANESHA'S<br>FESTIVAL QUEST</h1>
    <div class="subtitle">Play • Create • Explore • Celebrate</div>
    <button class="btn play" onclick="startGame()">▶️ PLAY NOW</button>
    <div class="grid">
      <button class="btn secondary" onclick="showInfo('map')">🗺️ Map</button>
      <button class="btn secondary" onclick="showInfo('home')">🏠 My Home</button>
      <button class="btn secondary" onclick="showInfo('passport')">📖 Passport</button>
      <button class="btn secondary" onclick="showInfo('settings')">⚙️ Settings</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>🎊 FESTIVAL SPIRIT</span><span id="homeSpirit">0%</span></div>
      <div class="progress"><div id="homeBar" class="bar"></div></div>
    </div>
    <div class="small">Complete 10 quick festival missions with Ganesha and Mushak!</div>
  </section>

  <section id="game" class="card hidden">
    <div id="missionIcon" class="mission-icon">🌸</div>
    <h2 id="missionTitle" class="mission-title"></h2>
    <p id="missionText" class="mission-text"></p>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback"></div>
  </section>

  <section id="result" class="card hidden">
    <div class="ganesha">🐘🎉</div>
    <h1>QUEST COMPLETE!</h1>
    <p class="subtitle">Ganpati Bappa Morya! 🌺</p>
    <div class="result-score"><span id="finalStars">0</span> ⭐</div>
    <p>You collected <b><span id="finalCoins">0</span> coins</b> and reached <b>100% Festival Spirit</b>!</p>
    <button class="btn play" onclick="startGame()">🔄 PLAY AGAIN</button>
    <button class="btn secondary" style="margin-top:10px;width:100%" onclick="goHome()">🏠 HOME</button>
  </section>
</div>

<script>
const missions=[
 {icon:"🌸",title:"Flower Offering",text:"Which flower is traditionally offered to Lord Ganesha?",choices:["🌺 Hibiscus","🌹 Rose","🌷 Tulip","🌻 Sunflower"],answer:0},
 {icon:"🎨",title:"Rangoli Time",text:"Pick the best item to make a colourful rangoli.",choices:["🎨 Colours","📚 Books","🎧 Headphones","⚽ Ball"],answer:0},
 {icon:"🍬",title:"Modak Magic",text:"What sweet is especially associated with Ganesha?",choices:["🍬 Modak","🍰 Cake","🍨 Ice cream","🍪 Biscuit"],answer:0},
 {icon:"🥁",title:"Festival Beats",text:"What do you usually hear during a lively procession?",choices:["🥁 Drums","🎹 Piano","🎻 Violin","🎸 Guitar"],answer:0},
 {icon:"🪔",title:"Light the Diya",text:"A diya is traditionally lit as a symbol of...",choices:["✨ Light","🌧️ Rain","❄️ Snow","🌪️ Wind"],answer:0},
 {icon:"🌿",title:"Sacred Leaves",text:"Which leaf is commonly associated with Ganesha worship?",choices:["🍃 Durva grass","🍂 Maple","🌴 Palm","🍁 Oak"],answer:0},
 {icon:"🙏",title:"Prayer Time",text:"What is a respectful way to begin a puja?",choices:["🙏 Prayer","😴 Sleep","🏃 Run","🎮 Play"],answer:0},
 {icon:"🐭",title:"Help Mushak",text:"Who is Ganesha's famous little vahana?",choices:["🐭 Mushak","🦁 Lion","🐴 Horse","🦚 Peacock"],answer:0},
 {icon:"🛕",title:"Temple Visit",text:"Where can devotees traditionally offer prayers?",choices:["🛕 Temple","🏖️ Beach","🎬 Cinema","🏟️ Stadium"],answer:0},
 {icon:"🎊",title:"Grand Celebration",text:"What should we spread during the festival?",choices:["❤️ Joy & kindness","😡 Anger","😴 Boredom","🙈 Fear"],answer:0}
];

let current=0,coins=0,stars=0;

function makePetals(){
 const emojis=["🌸","🌼","🌺","✨","🏵️","🍃"];
 for(let i=0;i<22;i++){
   const s=document.createElement("span");
   s.className="petal";
   s.textContent=emojis[i%emojis.length];
   s.style.left=Math.random()*100+"%";
   s.style.animationDuration=(8+Math.random()*9)+"s";
   s.style.animationDelay=(-Math.random()*12)+"s";
   s.style.fontSize=(14+Math.random()*15)+"px";
   document.getElementById("petals").appendChild(s);
 }
}
function updateStats(){
 document.getElementById("coins").textContent=coins;
 document.getElementById("stars").textContent=stars;
 const spirit=Math.round((current/10)*100);
 document.getElementById("spirit").textContent=spirit;
 document.getElementById("homeSpirit").textContent=spirit+"%";
 document.getElementById("homeBar").style.width=spirit+"%";
}
function startGame(){
 current=0;coins=0;stars=0;updateStats();
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 loadMission();
}
function loadMission(){
 const m=missions[current];
 document.getElementById("missionIcon").textContent=m.icon;
 document.getElementById("missionTitle").textContent=(current+1)+"/10 — "+m.title;
 document.getElementById("missionText").textContent=m.text;
 document.getElementById("feedback").textContent="";
 const box=document.getElementById("choices"); box.innerHTML="";
 m.choices.forEach((c,i)=>{
   const b=document.createElement("button");
   b.className="choice"; b.textContent=c;
   b.onclick=()=>answer(i);
   box.appendChild(b);
 });
}
function answer(i){
 const m=missions[current];
 const buttons=[...document.querySelectorAll(".choice")];
 buttons.forEach(b=>b.disabled=true);
 const feedback=document.getElementById("feedback");
 if(i===m.answer){
   stars++;coins+=10;feedback.textContent="🎉 Correct! +1 ⭐ +10 🪙";
   feedback.style.color="#2f9e62";
 }else{
   feedback.textContent="💛 Nice try! Ganesha bless you — keep going!";
   feedback.style.color="#d96a3d";
 }
 updateStats();
 setTimeout(()=>{
   current++;
   if(current>=missions.length) finishGame();
   else {updateStats();loadMission();}
 },900);
}
function finishGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 document.getElementById("finalStars").textContent=stars;
 document.getElementById("finalCoins").textContent=coins;
 current=10;updateStats();
}
function goHome(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("game").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 current=0;coins=0;stars=0;updateStats();
}
function showInfo(type){
 const messages={
   map:"🗺️ Your festival map: Flower Garden → Rangoli Street → Modak Kitchen → Temple Square!",
   home:"🏠 Welcome home! Your festival decorations are ready.",
   passport:"📖 Festival Passport: Complete all 10 missions to finish your quest!",
   settings:"⚙️ Settings: Sound and language options can be added later."
 };
 alert(messages[type]);
}
makePetals();
updateStats();
</script>
</body>
</html>
